name: Claude Trigger

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  produce-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Determine whether to trigger Claude
        id: check
        run: |
          if [[ "${{ github.event.comment.body }}" == *"@claude"* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare metadata
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "should_run=true" > metadata.txt
          echo "pr_number=${{ github.event.issue.number }}" >> metadata.txt
          echo "comment_id=${{ github.event.comment.id }}" >> metadata.txt
          echo "comment_body<<EOF" >> metadata.txt
          echo "${{ github.event.comment.body }}" >> metadata.txt
          echo "EOF" >> metadata.txt

      - name: Prepare noop metadata
        if: steps.check.outputs.should_run == 'false'
        run: |
          echo "should_run=false" > metadata.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: claude-input
          path: metadata.txt